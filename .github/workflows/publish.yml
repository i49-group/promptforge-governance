name: publish

# Publishes @i49-group/governance-pdp and @i49-group/plugin-hermes to npm when a
# `vX.Y.Z` tag is pushed. Both packages share one version.
#
# Authentication is npm trusted publishing: npm checks this workflow's GitHub identity,
# so no npm token is stored here, and every version carries a provenance statement naming
# the commit and run it was built from (`npm audit signatures` verifies it).
#
# npm can only register a trusted publisher on a package that already exists. The first
# release therefore runs with a short-lived `NPM_FIRST_PUBLISH_TOKEN` secret, so it is
# built here and carries provenance like every later one. Delete that secret once the
# trusted publisher is registered.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # Trusted publishing needs npm 11.5.1 or later, which ships with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/governance-pdp packages/plugin-hermes; do
            version="$(node -p "require('./$pkg/package.json').version")"
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is $version, tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Python Hermes evaluator agrees
        run: python3 -m unittest discover -s hermes-plugin -p 'test_*.py' -v

      - name: First release only — token auth
        env:
          NPM_FIRST_PUBLISH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN }}
        if: env.NPM_FIRST_PUBLISH_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_FIRST_PUBLISH_TOKEN}" > "$HOME/.npmrc"

      - name: Publish
        run: pnpm -r --filter './packages/*' publish --no-git-checks
