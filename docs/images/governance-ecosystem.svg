<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How PromptForge governs a tool call</title>
  <desc id="d">PromptForge publishes two things for each agent. The Talk pack is what the agent is told; it goes into the model's prompt and is guidance, not enforced. The signed bundle is what the agent may do (Act). The host's check and the provider's check each fetch it, decide every call by exact name as allow, ask (requires approval) or deny, and report their decisions back to PromptForge.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366F1"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker>
    <style>
      .zone{rx:14;stroke-width:1.5}
      .pf{fill:#EEF2FF;stroke:#6366F1}
      .host{fill:#ECFDF5;stroke:#10B981}
      .prv{fill:#FFFBEB;stroke:#F59E0B}
      .zt{font-size:17px;font-weight:700;fill:#1E293B}
      .n{fill:#fff;stroke:#94A3B8;stroke-width:1.2;rx:10}
      .talk{fill:#fff;stroke:#94A3B8;stroke-width:1.2;stroke-dasharray:5 4;rx:10}
      .chk{fill:#fff;stroke:#1E293B;stroke-width:2;rx:10}
      .nt{font-size:15px;font-weight:600;fill:#0F172A;text-anchor:middle}
      .ns{font-size:13px;fill:#475569;text-anchor:middle}
      .out{font-size:12.5px;font-weight:600;fill:#0F172A;text-anchor:middle}
      .e{fill:none;stroke:#475569;stroke-width:1.6;marker-end:url(#a)}
      .g{fill:none;stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#ag)}
      .r{fill:none;stroke:#6366F1;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#ad)}
      .l{font-size:13px;fill:#334155}
      .lg{font-size:13px;fill:#64748B}
      .lr{font-size:13px;fill:#4F46E5}
      .code{font-family:Menlo, Consolas, monospace;font-size:12.5px}
    </style>
  </defs>

  <rect class="zone pf" x="20" y="20" width="1160" height="120"/>
  <text class="zt" x="40" y="46">PromptForge: the policy plane</text>
  <rect class="talk" x="60" y="62" width="240" height="62"/>
  <text class="nt" x="180" y="88">Talk pack</text>
  <text class="ns" x="180" y="108">what the agent is told</text>
  <rect class="n" x="440" y="62" width="200" height="62"/>
  <text class="nt" x="540" y="88">Policy</text>
  <text class="ns" x="540" y="108">one entry per action</text>
  <rect class="n" x="720" y="62" width="260" height="62"/>
  <text class="nt" x="850" y="88">Signed bundle (Act)</text>
  <text class="ns" x="850" y="108">exact names, enforced by checks</text>
  <path class="e" d="M640 93H718"/>

  <rect class="zone host" x="20" y="190" width="560" height="390"/>
  <text class="zt" x="40" y="218">Host, e.g. Hermes</text>
  <rect class="n" x="60" y="235" width="220" height="52"/>
  <text class="nt" x="170" y="258">Agent</text>
  <text class="ns" x="170" y="277">e.g. sales-agent</text>
  <rect class="n" x="60" y="320" width="220" height="52"/>
  <text class="nt" x="170" y="351">Model</text>
  <rect class="chk" x="60" y="425" width="220" height="76"/>
  <text class="nt" x="170" y="449">Host check</text>
  <text class="ns" x="170" y="467">PromptForge plugin</text>
  <text class="out" x="170" y="488">allow · ask · deny</text>
  <rect class="n" x="340" y="505" width="210" height="56"/>
  <text class="nt" x="445" y="529">Host-local tools</text>
  <text class="ns code" x="445" y="548">terminal, read_file</text>
  <path class="g" d="M170 124V233"/>
  <text class="lg" x="182" y="161">into the prompt context:</text>
  <text class="lg" x="182" y="177">guidance, not enforced</text>
  <path class="e" d="M170 287V318"/>
  <path class="e" d="M170 372V423"/>
  <text class="l" x="182" y="396">asks for</text>
  <text class="l code" x="182" y="413">mcp__crm__email_send_now</text>
  <path class="e" d="M240 501V533H338"/>
  <text class="l" x="252" y="516">allowed</text>
  <text class="l" x="252" y="530">local call</text>

  <rect class="zone prv" x="620" y="190" width="560" height="390"/>
  <text class="zt" x="640" y="218">Provider, e.g. a CRM</text>
  <rect class="n" x="660" y="425" width="220" height="60"/>
  <text class="nt" x="770" y="451">MCP server</text>
  <text class="ns code" x="770" y="471">email.send_now, …</text>
  <rect class="chk" x="930" y="425" width="210" height="76"/>
  <text class="nt" x="1035" y="449">Provider check</text>
  <text class="ns" x="1035" y="467">its own tool names</text>
  <text class="out" x="1035" y="488">allow · ask · deny</text>
  <rect class="n" x="930" y="520" width="210" height="52"/>
  <text class="nt" x="1035" y="543">Does the work</text>
  <text class="ns" x="1035" y="561">sends the email</text>
  <path class="e" d="M880 455H928"/>
  <path class="e" d="M1035 501V518"/>

  <path class="e" d="M280 468H658"/>
  <text class="l" x="412" y="446">allowed remote call,</text>
  <text class="l" x="412" y="461">sent as</text>
  <text class="l code" x="464" y="461">email.send_now</text>

  <path class="e" d="M780 124V160H400V438H282"/>
  <text class="l" x="408" y="300">fetched</text>
  <text class="l" x="408" y="316">every few minutes</text>
  <path class="e" d="M920 124V160H1035V423"/>
  <text class="l" x="1045" y="290">fetched, at most</text>
  <text class="l" x="1045" y="306">every 10 min</text>
  <text class="l" x="1045" y="322">while in use</text>

  <rect class="zone pf" x="20" y="620" width="1160" height="84"/>
  <text class="zt" x="40" y="648">PromptForge</text>
  <rect class="n" x="440" y="637" width="320" height="52"/>
  <text class="nt" x="600" y="660">Decision record</text>
  <text class="ns" x="600" y="679">and enforcement console</text>
  <path class="r" d="M110 501V663H438"/>
  <text class="lr" x="122" y="605">reports decisions</text>
  <path class="r" d="M1140 455H1165V663H762"/>
  <text class="lr" x="1040" y="605">reports decisions</text>
</svg>
