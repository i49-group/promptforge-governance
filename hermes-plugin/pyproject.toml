[project]
name = "promptforge-governance-hermes"
version = "0.1.0"
description = "PromptForge policy enforcement point for Hermes agent hosts"
readme = "README.md"
license = { file = "../LICENSE" }
# 3.9 is the floor, and it is deliberate rather than incidental: stock macOS ships
# python3 3.9, so the plugin drops onto a host with no venv and no install step. The PEP
# 604 unions in the source (`BaseException | str`) are annotations only and every module
# carries `from __future__ import annotations`, so they are never evaluated at runtime —
# verified on 3.9 including `typing.get_type_hints`. The CI matrix tests the floor and
# the ceiling; if a change makes 3.9 fail, that is a compatibility break to decide on
# deliberately, not to discover on someone else's host.
requires-python = ">=3.9"
# No third-party runtime dependencies, by design. The plugin uses only urllib, hmac,
# hashlib, json and threading from the standard library, so it can be dropped onto a
# host without introducing a dependency tree into a security-critical path.
dependencies = []

[project.urls]
Homepage = "https://github.com/i49-group/promptforge-governance"
Issues = "https://github.com/i49-group/promptforge-governance/issues"

[tool.pytest.ini_options]
python_files = "test_*.py"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
