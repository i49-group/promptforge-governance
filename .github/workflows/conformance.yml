name: conformance

# Proves the TypeScript and Python evaluators reach identical decisions.
# Both run conformance/vectors.json. If they disagree, hosts are being governed
# differently and this job fails.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evaluators-agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile

      - name: TypeScript reference evaluator
        run: pnpm --filter @promptforge/governance-pdp test

      - name: Python Hermes evaluator
        run: python3 -m unittest discover -s hermes-plugin -p 'test_*.py' -v
