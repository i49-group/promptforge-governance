name: publish

# Stages @i49-group/governance-pdp and @i49-group/plugin-hermes on npm when a `vX.Y.Z` tag
# is pushed. Both packages share one version.
#
# Two people-present gates, by design:
#   1. The `npm-publish` GitHub environment waits for a maintainer to approve the run.
#   2. The run only *stages* each version. A maintainer approves it on npmjs.com (or with
#      `npm stage approve`) using 2FA before it becomes installable.
#
# Authentication is npm trusted publishing: npm checks this workflow's GitHub identity and
# environment, so no npm token is stored anywhere, and both packages disallow tokens. Every
# version carries a provenance statement naming the commit and run it was built from
# (`npm audit signatures` verifies it).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      # No dependency cache in a release build: what ships is built from a clean install.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `npm stage` needs npm 11.15.0 or later.
      - run: npm install -g npm@^11.15.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/governance-pdp packages/plugin-hermes; do
            version="$(node -p "require('./$pkg/package.json').version")"
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is $version, tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Python Hermes evaluator agrees
        run: python3 -m unittest discover -s hermes-plugin -p 'test_*.py' -v

      # `pnpm pack` turns `workspace:*` into real versions; npm stages the tarball it made.
      - name: Stage both packages
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          for pkg in packages/governance-pdp packages/plugin-hermes; do
            (cd "$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/release")
          done
          for tarball in "$RUNNER_TEMP"/release/*.tgz; do
            npm stage publish "$tarball" --access public --provenance
          done
          echo "Staged. Approve each version on npmjs.com (Staged Packages) with 2FA." >> "$GITHUB_STEP_SUMMARY"
